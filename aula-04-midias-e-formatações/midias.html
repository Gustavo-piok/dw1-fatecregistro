<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Inserindo mídias no HTML5</title>
</head>
<body>
    <h1>Incorporando mídias no site</h1>
    <h2>Imagens</h2>
    <img src=".\midias\imagem.jpg" lt="foto de paisagem" width="300px" height="300px">

    <h2>Imagens com legenda:</h2>
    <figure>
        <img src=".\midias\grafico.png" alt="Gráfico de crescimento anual da empresa" width="300px">
        <figcaption>Gráfico de crescimento da empresa em 2025</figcaption>
    </figure>

    <h2>Áudio:</h2>
    <audio controls>
        <source src=".\midias\audio.mp3" type="audio/mpeg">
        Não foi possível reproduzir o áudio.
    </audio>

    <h2>Vídeo:</h2>
    <video controls width="400px">
        <source src=".\midias\video.mp4" type="video/mp4">
        Não foi possivel reproduzir o vídeo.
    </video>

    <h2>Vídeo incorporado do youtube:</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/IvPJri0u0R8?si=iiumxtKAqb2yRhkU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    src=".\midias\documento.pdf"
    title="Horários do DSM-1"
    width="600px"
    height="450px"></iframe>
