<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Inline</title>
</head>
<body>
    <H1>Demontração de CSS Inline</H1>
    <p style="color: blue; font-size: 30px;">
        Este parágrafo utiliza CSS inline através do atributo style.
    </p>
<p style="color: red;
font-weight: bold;
background-color: rgb(177, 226, 43);">
Outro parágrafo com múltiplas propriedades CSS inline 
</p>

<div style="border: 2px solid green; width: 400px; padding: 50px; margin: 50px;">
    Está é uma div estilizada com css inline.
</div>
<!-- padding espaçamento interno/ margin: espaçamento externo -->

<h2 style="color: rgba(170, 15, 170, 0.692);
text-align: center;">
título centralizado com cor hexadecimal
</h2>

<div style="background-color: orange; font-size: 32px; color: white;
height: 400px; width: 600px; text-align: center;"> 
Desafio CSS inline
</div>


</body>


</html>
