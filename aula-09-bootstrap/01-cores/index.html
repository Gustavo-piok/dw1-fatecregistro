<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes de cores no Bootstrap</title>
    <!-- importação do css bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>

<body>
    <h1>Cores no Bootstrap</h1>

    <p class="h3 text-muted">muted</p>
    <p class="h2 text-primary">primary</p>
    <p class="h3 text-success">success</p>
    <p class="h3 text-info">info</p>
    <p class="h3 text-warning">warning</p>
    <p class="h3 text-danger">danger</p>
    <p class="h3 text-secondary">secondary</p>
    <p class="h3 text-dark">dark</p>
    <p class="h3 text-light bg-success">light</p>
    <p class="h2 text-white-50 bg-danger">alterando a opacidade</p>

    <hr>

    <h1>Botões no Bootstrap</h1>
    <button type="button" class="btn">normal</button><br><br>
    <button type="button" class="btn btn-primary">primário</button><br><br>
    <button type="button" class="btn btn-secondary">segundário</button><br><br>
    <button type="button" class="btn btn-success">sucesso</button><br><br>
    <button type="button" class="btn btn-info">informação</button><br><br>
    <button type="button" class="btn btn-warning">alertas</button><br><br>
    <button type="button" class="btn btn-danger">erro/perigo</button><br><br>
    <button type="button" class="btn btn-dark">escuro</button><br><br>
    <button type="button" class="btn btn-light">claro</button><br><br>

    <!-- importação do js do bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
        integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
        crossorigin="anonymous"></script>
</body>

</html>
